name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build Roku package
        run: npm test

      - name: Upload unsigned development sideload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SplashZone-dev-sideload
          path: dist/SplashZone.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Roku package
        uses: actions/download-artifact@v4
        with:
          name: SplashZone-dev-sideload
          path: dist

      - name: Create versioned release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version '$version' is not a stable SemVer version."
            exit 1
          fi
          tag="v$version"
          asset="dist/SplashZone.zip#SplashZone-dev-sideload.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            target_sha="$(git rev-parse "$target^{commit}")"
            if [ "$target_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag already points to $target_sha; refusing to replace it for $GITHUB_SHA."
              exit 1
            fi
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --generate-notes
          fi
